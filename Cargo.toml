[package]
name = "xiaomeng"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "树莓派 4 离线语音助手（whisper.cpp + DeepSeek + Piper）"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.2"
dotenvy = "0.15.7"
hound = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = "15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "time",
    "sync",
    "signal",
    "io-util",
    "net",
] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
