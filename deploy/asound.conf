# ALSA 默认设备示例（安装到 /etc/asound.conf）。
#
# 树莓派 4 + 蓝牙音箱有两种常见做法：
#
# A. 使用 PulseAudio / PipeWire（Raspberry Pi OS Bookworm 默认）：
#    蓝牙设备由桌面音频服务管理，ALSA 通过 pulse 插件转发。
#    这是最省事、也最稳定的方案，cpal 会看到 "pulse" / "default" 设备。
#
# B. 使用 bluealsa（无桌面、纯命令行）：
#    需要安装 bluealsa，并把 default 指向 bluealsa 设备。
#
# 先运行 `aplay -L` / `arecord -L` 看看系统暴露了哪些名字，
# 再把 config.toml 里的 input_device / output_device 填成对应片段。

# ---- 方案 A：PulseAudio / PipeWire ----
pcm.!default {
    type pulse
    hint.description "Default PulseAudio/PipeWire device"
}

ctl.!default {
    type pulse
}

# ---- 方案 B：bluealsa（取消注释并改地址后使用） ----
# 蓝牙地址用 `bluetoothctl info <MAC>` 查看。
#
# pcm.!default {
#     type plug
#     slave.pcm {
#         type bluealsa
#         device "AA:BB:CC:DD:EE:FF"
#         profile "a2dp"
#     }
