# PipeWire 全局回声消除（WebRTC AEC）
#
# 安装到 /etc/pipewire/pipewire.conf.d/51-xiaomeng-aec.conf 后重启 pipewire。
#
# 说明（Ubuntu 22.04 / PipeWire 0.3.48 专用）：
#   * 0.3.48 的文档注释说默认引擎是 aec/libspa-aec-exaudio，但代码里实际默认
#     已经是 aec/libspa-aec-webrtc（jammy 也只提供 webrtc/null）。这里显式写死，
#     避免不同版本或别人改过的配置把引擎换掉。
#   * 0.3.48 的 aec.args 是「空格分隔的 key=value 字符串」，不是 JSON 对象；
#     写成对象会被静默忽略。
#   * 0.3.48 的模块只能连接到「当前默认」的 source/sink，不支持按设备名绑定
#     （capture.props/playback.props + node.target 是 0.3.6x 之后才有的）。
#     因此请先让蓝牙耳机连上并成为默认设备，再加载/重启本模块。
#   * 两个虚拟节点用 priority.session 提高优先级，WirePlumber 会优先选它们做默认。

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc

            # AEC 处理块大小。256/48000 ≈ 5.3ms，蓝牙链路上比较稳。
            node.latency = 256/48000

            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Xiaomeng AEC Source"
                priority.session = 2000
            }

            sink.props = {
                node.name = "echo-cancel-sink"
                node.description = "Xiaomeng AEC Sink"
                priority.session = 2000
            }

            # 0.3.48 中 gain_control 默认关闭，播报音量小时容易听不清，这里打开。
            aec.args = "webrtc.gain_control=true webrtc.noise_suppression=true webrtc.high_pass_filter=true webrtc.delay_agnostic=true"
        }
    }
]
